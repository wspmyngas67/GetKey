<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Key</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f1a;
    --bg-2: #0d1422;
    --surface: #111a2b;
    --surface-2: #16213a;
    --border: #1e2b44;
    --border-2: #2a3b5c;
    --text: #e6edf7;
    --text-muted: #8b9cc0;
    --text-subtle: #5a6b8c;
    --blue: #3b82f6;
    --blue-bright: #60a5fa;
    --blue-deep: #1d4ed8;
    --blue-glow: rgba(59, 130, 246, 0.25);
    --radius: 12px;
  }

  body {
    background:
      radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.12), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(29, 78, 216, 0.10), transparent 45%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    padding: 3rem 1.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  header {
    margin-bottom: 2rem;
    text-align: center;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--text) 0%, var(--blue-bright) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .generate-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
    padding: 3rem 1.5rem;
    background:
      linear-gradient(180deg, rgba(59, 130, 246, 0.06) 0%, transparent 100%),
      var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      0 20px 40px -20px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.03);
    position: relative;
    overflow: hidden;
  }

  .generate-area::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    opacity: 0.6;
  }

  .result-display {
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    text-align: center;
    padding: 0 1rem;
  }

  .result-word {
    font-size: 2.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    word-break: break-word;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 0%, var(--blue-bright) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: wordPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 24px rgba(59, 130, 246, 0.35));
  }

  @keyframes wordPop {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }

  .result-placeholder {
    font-size: 2.25rem;
    font-weight: 300;
    color: var(--text-subtle);
    letter-spacing: 0.05em;
  }

  .generate-btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.95rem 2.5rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s ease;
    border: 1px solid var(--blue);
    background: linear-gradient(145deg, var(--blue) 0%, var(--blue-deep) 100%);
    color: #ffffff;
    box-shadow:
      0 8px 20px -6px var(--blue-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  .generate-btn:hover {
    background: linear-gradient(145deg, var(--blue-bright) 0%, var(--blue) 100%);
    box-shadow:
      0 12px 28px -6px var(--blue-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
  }

  .generate-btn:active {
    transform: translateY(0) scale(0.98);
    box-shadow: 0 4px 12px -4px var(--blue-glow);
  }

  @media (max-width: 480px) {
    body { padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; }
    .result-word { font-size: 2rem; }
    .generate-area { padding: 2.25rem 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Key</h1>
    <p class="subtitle">Click the button to generate a key.</p>
  </header>

  <div class="generate-area">
    <div class="result-display" id="resultDisplay">
      <span class="result-placeholder">—</span>
    </div>
    <button class="generate-btn" id="generateBtn">Generate word</button>
  </div>
</div>

<script>
  // ============================================================
  //  CONFIGURATION — edit your word list here
  // ============================================================
  const WORDS = [
    'apple',
    'banana',
    'cherry',
    'dragonfruit',
    'elderberry',
    'fig',
    'grape',
    'honeydew'
  ];
  // ============================================================

  (function () {
    const resultDisplay = document.getElementById('resultDisplay');
    const generateBtn = document.getElementById('generateBtn');

    function generateWord() {
      if (!WORDS.length) {
        resultDisplay.innerHTML = '<span class="result-placeholder">No words configured</span>';
        return;
      }

      const pick = WORDS[Math.floor(Math.random() * WORDS.length)];

      resultDisplay.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'result-word';
      span.textContent = pick;
      resultDisplay.appendChild(span);
    }

    generateBtn.addEventListener('click', generateWord);

    // Disable if no words configured
    if (!WORDS.length) generateBtn.disabled = true;
  })();
</script>
</body>
</html>
