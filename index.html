<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Word Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f1a;
    --bg-2: #0d1422;
    --surface: #111a2b;
    --surface-2: #16213a;
    --border: #1e2b44;
    --border-2: #2a3b5c;
    --border-focus: #3b82f6;
    --text: #e6edf7;
    --text-muted: #8b9cc0;
    --text-subtle: #5a6b8c;
    --blue: #3b82f6;
    --blue-bright: #60a5fa;
    --blue-deep: #1d4ed8;
    --blue-glow: rgba(59, 130, 246, 0.25);
    --radius: 12px;
  }

  body {
    background:
      radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.12), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(29, 78, 216, 0.10), transparent 45%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    padding: 3rem 1.5rem;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 2rem;
    text-align: center;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--text) 0%, var(--blue-bright) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  /* ---- Config toggle ---- */
  .config-toggle {
    display: block;
    margin: 0 auto 1.5rem;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-subtle);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0.45rem 0.9rem;
    border-radius: 8px;
    transition: all 0.15s;
  }

  .config-toggle:hover {
    color: var(--blue-bright);
    background: rgba(59, 130, 246, 0.08);
    border-color: rgba(59, 130, 246, 0.2);
  }

  /* ---- Config panel ---- */
  .config {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 2rem;
    box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.2s ease-out;
  }

  .config.open { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .config-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--blue-bright);
    margin-bottom: 0.65rem;
    display: block;
  }

  textarea {
    width: 100%;
    min-height: 130px;
    padding: 0.85rem 1rem;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s, box-shadow 0.15s;
    line-height: 1.6;
  }

  textarea::placeholder { color: var(--text-subtle); }

  textarea:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--blue-glow);
    background: var(--bg-2);
  }

  .config-hint {
    font-size: 0.78rem;
    color: var(--text-subtle);
    margin-top: 0.65rem;
    line-height: 1.5;
  }

  .config-status {
    font-size: 0.78rem;
    color: var(--blue-bright);
    margin-top: 0.5rem;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  /* ---- Generate area ---- */
  .generate-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2.75rem 1.5rem;
    background:
      linear-gradient(180deg, rgba(59, 130, 246, 0.06) 0%, transparent 100%),
      var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      0 20px 40px -20px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.03);
    position: relative;
    overflow: hidden;
  }

  .generate-area::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    opacity: 0.6;
  }

  .result-display {
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    text-align: center;
    padding: 0 1rem;
  }

  .result-word {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    word-break: break-word;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 0%, var(--blue-bright) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: wordPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 24px rgba(59, 130, 246, 0.35));
  }

  @keyframes wordPop {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }

  .result-placeholder {
    font-size: 2rem;
    font-weight: 300;
    color: var(--text-subtle);
    letter-spacing: 0.05em;
  }

  .generate-btn {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.9rem 2.25rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s ease;
    border: 1px solid var(--blue);
    background: linear-gradient(145deg, var(--blue) 0%, var(--blue-deep) 100%);
    color: #ffffff;
    box-shadow:
      0 8px 20px -6px var(--blue-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  .generate-btn:hover {
    background: linear-gradient(145deg, var(--blue-bright) 0%, var(--blue) 100%);
    box-shadow:
      0 12px 28px -6px var(--blue-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
  }

  .generate-btn:active {
    transform: translateY(0) scale(0.98);
    box-shadow: 0 4px 12px -4px var(--blue-glow);
  }

  .generate-btn:disabled {
    background: var(--surface-2);
    border-color: var(--border);
    color: var(--text-subtle);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .empty-note {
    font-size: 0.82rem;
    color: var(--text-subtle);
    text-align: center;
  }

  @media (max-width: 480px) {
    body { padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; }
    .result-word { font-size: 1.9rem; }
    .generate-area { padding: 2rem 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Random Word</h1>
    <p class="subtitle">Click to generate a random word from your list.</p>
  </header>

  <button class="config-toggle" id="configToggle">⚙ Configure list</button>

  <div class="config" id="configPanel">
    <label class="config-label" for="wordList">Words (one per line)</label>
    <textarea id="wordList" placeholder="apple&#10;banana&#10;cherry&#10;dragonfruit"></textarea>
    <p class="config-hint">Each line is one entry. Blank lines are ignored.</p>
    <p class="config-status" id="configStatus">0 words ready</p>
  </div>

  <div class="generate-area">
    <div class="result-display" id="resultDisplay">
      <span class="result-placeholder">—</span>
    </div>
    <button class="generate-btn" id="generateBtn">Generate word</button>
    <p class="empty-note" id="emptyNote" style="display:none;">Add some words in the config above first.</p>
  </div>
</div>

<script>
(function () {
  const wordListEl = document.getElementById('wordList');
  const configPanel = document.getElementById('configPanel');
  const configToggle = document.getElementById('configToggle');
  const configStatus = document.getElementById('configStatus');
  const resultDisplay = document.getElementById('resultDisplay');
  const generateBtn = document.getElementById('generateBtn');
  const emptyNote = document.getElementById('emptyNote');

  const STORAGE_KEY = 'random-word-list';

  function getWords() {
    return wordListEl.value
      .split('\n')
      .map(w => w.trim())
      .filter(w => w.length > 0);
  }

  function updateStatus() {
    const count = getWords().length;
    configStatus.textContent = `${count} ${count === 1 ? 'word' : 'words'} ready`;
    generateBtn.disabled = count === 0;
    emptyNote.style.display = count === 0 ? 'block' : 'none';
  }

  function saveWords() {
    try { localStorage.setItem(STORAGE_KEY, wordListEl.value); }
    catch (e) { /* ignore */ }
  }

  function loadWords() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) wordListEl.value = saved;
    } catch (e) { /* ignore */ }
  }

  function generateWord() {
    const words = getWords();
    if (!words.length) return;

    const pick = words[Math.floor(Math.random() * words.length)];

    resultDisplay.innerHTML = '';
    const span = document.createElement('span');
    span.className = 'result-word';
    span.textContent = pick;
    resultDisplay.appendChild(span);
  }

  configToggle.addEventListener('click', () => {
    configPanel.classList.toggle('open');
    configToggle.textContent = configPanel.classList.contains('open')
      ? '✕ Hide list'
      : '⚙ Configure list';
  });

  wordListEl.addEventListener('input', () => {
    updateStatus();
    saveWords();
  });

  generateBtn.addEventListener('click', generateWord);

  loadWords();
  updateStatus();
})();
</script>
</body>
</html>
